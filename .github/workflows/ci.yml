name: CI - Lint, Test, Security and Build

on:
  push:
    branches: ["main", "develop", "feature/**"]
  pull_request:
    branches: ["main", "develop"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  lint:
    name: Lint and Format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agentic_rag_fastapi

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff linter
        run: ruff check . --output-format=github || true

      - name: Run Ruff formatter check
        run: ruff format . --check || true

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agentic_rag_fastapi

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install mypy pydantic-settings pydantic fastapi
          pip install types-requests types-setuptools

      - name: Run mypy
        run: mypy . --ignore-missing-imports --exclude 'tests/' || true

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agentic_rag_fastapi

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install security tools
        run: pip install bandit

      - name: Run Bandit SAST
        run: |
          bandit -r . \
            --exclude ./tests,./venv,./.venv \
            --skip B101,B104 \
            --severity-level medium \
            --confidence-level medium \
            -f json -o bandit-report.json || true

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-security-report
          path: agentic_rag_fastapi/bandit-report.json

  test:
    name: Tests Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    defaults:
      run:
        working-directory: agentic_rag_fastapi

    env:
      GROQ_API_KEY: "test-groq-key-not-real"
      API_KEY: "test-api-key-2026"
      DEMO_MODE: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq || true
          sudo apt-get install -y --no-install-recommends tesseract-ocr poppler-utils libglib2.0-0 || true

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio httpx pydantic-settings

      - name: Download NLTK data
        run: python -c "import nltk; nltk.download('punkt'); nltk.download('punkt_tab')" || true

      - name: Run tests
        run: |
          pytest tests/ \
            --tb=short \
            --cov=. \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-omit="tests/*,venv/*,data/*" \
            -v

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-py${{ matrix.python-version }}
          path: agentic_rag_fastapi/coverage.xml

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present || true

      - name: Build production bundle
        run: npm run build
        env:
          VITE_API_URL: "http://localhost:8002"
          VITE_API_KEY: "demo-rag-2026"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  docker:
    name: Docker Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./agentic_rag_fastapi
          file: ./agentic_rag_fastapi/Dockerfile
          push: false
          tags: agentic-rag-backend:ci-${{ github.sha }}

  ci-success:
    name: CI Gate
    runs-on: ubuntu-latest
    needs: [lint, security, test, frontend, docker]
    if: always()
    steps:
      - name: All checks complete
        run: echo "All CI checks complete"
