name: CI — Lint, Test, Security & Build

on:
  push:
    branches: ["main", "develop", "feature/**"]
  pull_request:
    branches: ["main", "develop"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

# ── Jobs ──────────────────────────────────────────────────────
jobs:
  # ──────────────────────────────────────────────────────────
  # Job 1: Code Quality (Ruff lint + format check)
  # ──────────────────────────────────────────────────────────
  lint:
    name: "🔍 Lint & Format (Ruff)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agentic_rag_fastapi

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff linter
        run: ruff check . --output-format=github

      - name: Run Ruff formatter check
        run: ruff format . --check

  # ──────────────────────────────────────────────────────────
  # Job 2: Type Checking (mypy)
  # ──────────────────────────────────────────────────────────
  typecheck:
    name: "🔎 Type Check (mypy)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agentic_rag_fastapi

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install mypy pydantic-settings pydantic fastapi
          pip install types-requests types-setuptools

      - name: Run mypy
        run: mypy . --ignore-missing-imports --exclude 'tests/'
        continue-on-error: true   # Non-blocking: report but don't fail CI

  # ──────────────────────────────────────────────────────────
  # Job 3: Security Scanning (Bandit + Safety)
  # ──────────────────────────────────────────────────────────
  security:
    name: "🔒 Security Scan (Bandit + Safety)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agentic_rag_fastapi

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install security tools
        run: pip install bandit safety

      - name: Run Bandit (SAST)
        run: |
          bandit -r . \
            --exclude ./tests,./venv,./.venv \
            --skip B101,B104 \
            --severity-level medium \
            --confidence-level medium \
            -f json -o bandit-report.json || true
          bandit -r . \
            --exclude ./tests,./venv,./.venv \
            --skip B101,B104 \
            --severity-level high \
            --confidence-level high

      - name: Run Safety (dependency vulnerability scan)
        run: safety check --file requirements.txt --json || true

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-security-report
          path: agentic_rag_fastapi/bandit-report.json

  # ──────────────────────────────────────────────────────────
  # Job 4: Unit & Integration Tests (pytest + coverage)
  # ──────────────────────────────────────────────────────────
  test:
    name: "🧪 Tests (Python ${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    defaults:
      run:
        working-directory: agentic_rag_fastapi

    env:
      GROQ_API_KEY: "test-groq-key-not-real"
      API_KEY: "test-api-key-2026"
      DEMO_MODE: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr poppler-utils libglib2.0-0

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio httpx pydantic-settings

      - name: Download NLTK data
        run: python -c "import nltk; nltk.download('punkt'); nltk.download('punkt_tab')"

      - name: Run unit tests (offline, mocked)
        run: |
          pytest tests/ \
            -m "unit" \
            --tb=short \
            --cov=. \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-omit="tests/*,venv/*,data/*" \
            -v

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          file: agentic_rag_fastapi/coverage.xml
          flags: unittests
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-py${{ matrix.python-version }}
          path: agentic_rag_fastapi/coverage.xml

  # ──────────────────────────────────────────────────────────
  # Job 5: Frontend Build & Lint
  # ──────────────────────────────────────────────────────────
  frontend:
    name: "⚛️ Frontend Build (Node ${{ env.NODE_VERSION }})"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint --if-present
        continue-on-error: true

      - name: Type check (TypeScript)
        run: npm run type-check --if-present
        continue-on-error: true

      - name: Build production bundle
        run: npm run build
        env:
          VITE_API_URL: "http://localhost:8002"
          VITE_API_KEY: "demo-rag-2026"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # ──────────────────────────────────────────────────────────
  # Job 6: Docker Build Validation
  # ──────────────────────────────────────────────────────────
  docker:
    name: "🐳 Docker Build"
    runs-on: ubuntu-latest
    needs: [lint, test]   # Only build if lint + tests pass

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image (no push)
        uses: docker/build-push-action@v5
        with:
          context: ./agentic_rag_fastapi
          file: ./agentic_rag_fastapi/Dockerfile
          push: false
          tags: agentic-rag-backend:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1

  # ──────────────────────────────────────────────────────────
  # Job 7: Status gate (all-green check for PRs)
  # ──────────────────────────────────────────────────────────
  ci-success:
    name: "✅ CI Gate"
    runs-on: ubuntu-latest
    needs: [lint, security, test, frontend, docker]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.lint.result }}" != "success" ]]; then
            echo "Lint failed"
            exit 1
          fi
          if [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "Tests failed"
            exit 1
          fi
          echo "All CI checks passed ✅"
